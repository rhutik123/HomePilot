{% extends "base.html" %}

{% block title %}Log In - HomePilot{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="bg-[var(--bg-card)] p-8 sm:p-10 rounded-3xl border border-[var(--border-color)] shadow-xl relative overflow-hidden">
        <div class="absolute -right-12 -top-12 w-40 h-40 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="text-center mb-8 relative z-10">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-black mx-auto mb-4 shadow-lg shadow-indigo-600/30">
                <i data-lucide="receipt" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-[var(--text-primary)]">Welcome to HomePilot</h2>
            <p class="text-xs sm:text-sm text-[var(--text-secondary)] mt-1">Smart household finance, bill tracking, and AI copilot.</p>
        </div>

        <form method="POST" class="space-y-4 relative z-10">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider mb-1.5">Username or Email</label>
                <div class="relative">
                    <input type="text" name="username_or_email" required placeholder="Enter username or email" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-input)] text-sm text-[var(--text-primary)] placeholder-[var(--text-muted)] focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition">
                    <div class="absolute left-3 top-3 text-[var(--text-muted)] pointer-events-none">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </div>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider mb-1.5">Password</label>
                <div class="relative">
                    <input type="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-input)] text-sm text-[var(--text-primary)] placeholder-[var(--text-muted)] focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition">
                    <div class="absolute left-3 top-3 text-[var(--text-muted)] pointer-events-none">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </div>
                </div>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold py-3 rounded-xl text-sm transition shadow-md shadow-indigo-600/20 mt-2 flex items-center justify-center gap-2">
                <span>Sign In to Household</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-[var(--border-color)] text-center text-xs text-[var(--text-muted)] relative z-10">
            Don't have an account? 
            <a href="{% url 'dashboard_web:register' %}" class="font-bold text-indigo-500 hover:text-indigo-400 transition ml-1">
                Register here &rarr;
            </a>
        </div>
    </div>
</div>
{% endblock %}
