{% extends "base.html" %}

{% block title %}Register - HomePilot{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-900">Create an Account</h2>
        <p class="text-xs text-slate-500 mt-1">Get started with household bill management and reminders.</p>
    </div>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Username</label>
            <input type="text" name="username" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Confirm Password</label>
            <input type="password" name="password_confirm" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm mt-2">
            Register
        </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500">
        Already have an account? <a href="{% url 'dashboard_web:login' %}" class="font-semibold text-indigo-600 hover:text-indigo-800">Sign In</a>
    </div>
</div>
{% endblock %}
